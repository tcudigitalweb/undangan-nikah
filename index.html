<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undangan Pernikahan</title>

  <style>
    *{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
    body{margin:0;background:#fafafa;color:#333}

    header{
      min-height:100vh;
      height:100dvh;
      background:
        linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
        url('assets/img/cover.jpg');
      background-size:cover;
      background-position:center;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#fff;
      padding:24px;
    }

    .hero{
      position:relative;
      z-index:10;
    }

    .hero img{
      width:160px;
      height:160px;
      object-fit:cover;
      border-radius:50%;
      border:4px solid rgba(255,255,255,.8);
      margin-bottom:16px;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
    }

    h1{font-size:42px;margin:10px 0}
    p{margin:6px 0}

    .btn{
      margin-top:20px;
      padding:12px 28px;
      font-size:16px;
      border:none;
      border-radius:30px;
      cursor:pointer;
      background:#fff;
      color:#000;
    }

    section{padding:60px 20px;text-align:center}

    .gallery{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
      gap:12px;
      max-width:900px;
      margin:auto;
    }

    .gallery img{
      width:100%;
      height:200px;
      object-fit:cover;
      border-radius:12px;
      box-shadow:0 8px 20px rgba(0,0,0,.2);
    }

    @media(max-width:480px){
      h1{font-size:32px}
      .hero img{width:130px;height:130px}
    }
  </style>
</head>

<body>

<header>
  <div class="hero">
    <img src="assets/img/couple.jpg" alt="Pasangan">
    <p>Undangan Pernikahan</p>
    <h1>Ahmad Fauzi & Siti Aisyah</h1>
    <p>Minggu, 30 Januari 2026</p>
    <button id="playMusic" class="btn">Buka Undangan</button>
  </div>
</header>

<section>
  <h2>Memories</h2>
  <div class="gallery">
    <img src="assets/img/gallery/01.jpg">
    <img src="assets/img/gallery/02.jpg">
    <img src="assets/img/gallery/03.jpg">
    <img src="assets/img/gallery/04.jpg">
    <img src="assets/img/gallery/05.jpg">
    <img src="assets/img/gallery/06.jpg">
  </div>
</section>

<audio id="bgMusic" loop playsinline>
  <source src="assets/music/wedding.mp3" type="audio/mpeg">
</audio>

<script src="config.js"></script>
</body>
</html>
