<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undangan Pernikahan</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --primary:#8b5e3c;
      --secondary:#f5eee6;
      --dark:#3a2c23;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:'Poppins',sans-serif;
      background:var(--secondary);
      color:var(--dark);
    }

    header{
      min-height:100vh;
      background:
        linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
        url('assets/img/cover.jpg');
      background-size:cover;
      background-position:center;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#fff;
      padding:24px;
    }
    header h1{
      font-family:'Playfair Display',serif;
      font-size:42px;
      margin:12px 0;
    }
    .couple-photo{
      width:160px;
      height:160px;
      object-fit:cover;
      border-radius:50%;
      border:4px solid rgba(255,255,255,.85);
      margin-bottom:16px;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
    }

    section{
      max-width:760px;
      margin:auto;
      padding:60px 20px;
      text-align:center;
    }
    .card{
      background:#fff;
      border-radius:22px;
      padding:34px 28px;
      box-shadow:0 15px 40px rgba(0,0,0,.12);
      margin-bottom:40px;
    }
    h2{
      font-family:'Playfair Display',serif;
      font-size:28px;
      color:var(--primary);
      margin-bottom:16px;
    }
    .btn{
      display:inline-block;
      margin-top:18px;
      padding:12px 30px;
      background:var(--primary);
      color:#fff;
      border-radius:30px;
      font-size:14px;
      border:none;
      cursor:pointer;
    }

    .countdown{
      display:flex;
      gap:10px;
      margin-top:24px;
    }
    .time{
      flex:1;
      background:var(--secondary);
      border-radius:16px;
      padding:12px;
    }

    .slider{
      position:relative;
      height:260px;
      overflow:hidden;
      border-radius:18px;
    }
    .slider img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      opacity:0;
      transition:opacity .8s ease;
    }
    .slider img.active{opacity:1}

    input,textarea{
      width:100%;
      padding:10px;
      margin-bottom:10px;
      border-radius:10px;
      border:1px solid #ccc;
      font-family:'Poppins',sans-serif;
    }

    footer{
      text-align:center;
      padding:24px;
      font-size:13px;
      color:#777;
    }
    audio{display:none}
  </style>
</head>
<body>

<audio id="bgMusic" loop>
  <source src="assets/music/wedding.mp3" type="audio/mpeg">
</audio>

<header>
  <div>
    <img src="assets/img/couple.jpg" class="couple-photo" alt="Pasangan">
    <p>Undangan Pernikahan</p>
    <h1 id="namaPasangan"></h1>
    <p id="namaTamu">Kepada Yth. Bapak/Ibu</p>
    <button class="btn" id="playMusic">Buka Undangan</button>
  </div>
</header>

<section>

  <div class="card">
    <h2>Akad & Resepsi</h2>
    <p><span id="tanggal"></span></p>
    <p><span id="waktu"></span></p>
    <p><span id="tempat"></span></p>
    <p id="alamat"></p>
    <a class="btn" id="maps" target="_blank">Buka Maps</a>
  </div>

  <div class="card">
    <h2>Menuju Hari Bahagia</h2>
    <div class="countdown">
      <div class="time"><h3 id="d">0</h3>Hari</div>
      <div class="time"><h3 id="h">0</h3>Jam</div>
      <div class="time"><h3 id="m">0</h3>Menit</div>
      <div class="time"><h3 id="s">0</h3>Detik</div>
    </div>
  </div>

  <div class="card">
    <h2>Galeri Memories</h2>
    <div class="slider" id="galeri"></div>
  </div>

</section>

<footer>Terima kasih atas doa & restunya</footer>

<!-- JS TERPISAH -->
<script src="assets/js/main.js" defer></script>
</body>
</html>
